name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: validate and test (k8sman ${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest app, and the oldest release plugins must still load in.
        ref: [main, v0.2.15]
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins-repo
      - uses: actions/checkout@v4
        with:
          repository: matty234/k8sman
          ref: ${{ matrix.ref }}
          path: k8sman
      - uses: actions/setup-go@v5
        with:
          go-version-file: k8sman/backend/go.mod
          cache-dependency-path: k8sman/backend/go.sum
      - name: Build k8sman-server
        working-directory: k8sman/backend
        run: go build -o "$RUNNER_TEMP/k8sman-server" ./cmd/k8sman-server
      - name: Validate and test every plugin
        working-directory: plugins-repo
        run: |
          set -e
          for dir in plugins/*/; do
            "$RUNNER_TEMP/k8sman-server" plugin validate "$dir"
            "$RUNNER_TEMP/k8sman-server" plugin test "$dir"
          done

  permissions-label:
    name: label permission changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            // The text of the top-level permissions: block (to the next top-level key).
            const block = (text) => {
              const m = /^permissions:[^\n]*\n(?:(?![A-Za-z#]).*\n?)*/m.exec(text || '');
              return m ? m[0].replace(/#.*$/gm, '').replace(/\s+/g, ' ').trim() : '';
            };
            const read = async (ref, path) => {
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path, ref });
                return Buffer.from(res.data.content, 'base64').toString();
              } catch (e) {
                if (e.status === 404) return '';
                throw e;
              }
            };
            let changed = false;
            for (const f of files) {
              if (!/^plugins\/[^/]+\/plugin\.yaml$/.test(f.filename)) continue;
              const before = await read(pr.base.sha, f.filename);
              const after = f.status === 'removed' ? '' : await read(pr.head.sha, f.filename);
              if (block(before) !== block(after)) changed = true;
            }
            if (changed) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['permissions'],
              });
            }

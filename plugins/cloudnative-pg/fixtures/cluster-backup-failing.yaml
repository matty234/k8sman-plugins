# Instances are fine, but WAL archiving and the last backup are failing, the
# last good backup is old, and the server certificate was not renewed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-billing
  namespace: db
  uid: 11111111-0000-0000-0000-000000000003
  creationTimestamp: "2025-06-01T00:00:00Z"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  storage:
    size: 5Gi
  backup:
    retentionPolicy: 7d
    barmanObjectStore:

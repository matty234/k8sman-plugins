# A ClusterIssuer (it shares the Issuer entry through a YAML anchor) whose
# ACME account isn't registered.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  creationTimestamp: "2025-11-01T00:00:00Z"
spec:
  acme:
    server: https://acme-staging.example.com/directory
    email: admin@example.com
    solvers:
      - http01: {ingress: {class: nginx}}
      - dns01: {}
        selector:
          dnsZones: [example.com]
status:
  conditions:
    - type: Ready
      status: "False"
      reason: ErrRegisterACMEAccount
      message: Failed to register ACME account
      lastTransitionTime: "2025-12-20T00:00:00Z"

# A per-resource PolicyReport (Kyverno 1.10+): its scope is the Pod, its
# results come from a ClusterPolicy, a namespaced Policy and a 1.14+
# ValidatingPolicy.
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: 7d1e0b3f-0000-4000-8000-0000000000a1
  namespace: demo
  creationTimestamp: "2025-12-31T00:00:00Z"
  ownerReferences:
    - apiVersion: v1
      kind: Pod
      name: web-0
      uid: 7d1e0b3f-0000-4000-8000-0000000000a1
scope:
  apiVersion: v1
  kind: Pod
  name: web-0
  namespace: demo
  uid: 7d1e0b3f-0000-4000-8000-0000000000a1
results:
  - policy: disallow-latest
    rule: check-tag
    result: pass
    source: kyverno
  - policy: require-labels
    rule: check-app-label
    result: fail
    severity: medium
    message: "validation error: The label app is required."
    source: kyverno
  - policy: demo/limit-memory
    rule: check-limits
    result: warn
    message: memory limit is not set
    source: kyverno
  - policy: check-probes
    result: skip
    source: KyvernoValidatingPolicy
summary: {pass: 1, fail: 1, warn: 1, error: 0, skip: 1}

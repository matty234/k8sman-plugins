# A cluster-scoped object (a Namespace) and the ClusterPolicyReport it
# owns: a Policy results tab of its own (Namespaces have no Security tab).
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  uid: 7d1e0b3f-0000-4000-8000-0000000000d1
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: ClusterPolicyReport
metadata:
  name: 7d1e0b3f-0000-4000-8000-0000000000d1
  ownerReferences:
    - apiVersion: v1
      kind: Namespace
      name: demo
      uid: 7d1e0b3f-0000-4000-8000-0000000000d1
scope:
  apiVersion: v1
  kind: Namespace
  name: demo
  uid: 7d1e0b3f-0000-4000-8000-0000000000d1
results:
  - policy: require-ns-owner
    rule: check-owner-label
    result: warn
    message: label owner is missing
    source: kyverno
summary: {pass: 0, fail: 0, warn: 1, error: 0, skip: 0}

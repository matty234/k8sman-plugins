# A ClusterPolicy with a validate and a mutate rule, and the reports of the
# cluster: two per-resource reports that mention it (one failing), one in
# the older aggregated shape (results list their resources) and one that
# only mentions another policy.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  uid: 6c1f0a2e-0000-4000-8000-000000000001
  creationTimestamp: "2025-12-01T00:00:00Z"
spec:
  background: true
  rules:
    - name: check-app-label
      match:
        any:
          - resources:
              kinds: [Pod, Deployment]
              namespaces: [demo]
      exclude:
        any:
          - resources:
              namespaces: [kube-system]
      validate:
        failureAction: Enforce
        message: The label app is required.
        pattern:
          metadata:
            labels:
              app: "?*"
    - name: add-team
      match:
        resources:
          kinds: [Pod]
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(team): default
status:
  ready: true
  conditions:
    - type: Ready
      status: "True"
      reason: Succeeded
      message: Ready
  rulecount:
    validate: 1
    mutate: 1
    generate: 0
    verifyimages: 0
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: 7d1e0b3f-0000-4000-8000-0000000000a1
  namespace: demo
  ownerReferences:
    - apiVersion: v1
      kind: Pod
      name: web-0
      uid: 7d1e0b3f-0000-4000-8000-0000000000a1
scope:
  apiVersion: v1
  kind: Pod
  name: web-0
  namespace: demo
  uid: 7d1e0b3f-0000-4000-8000-0000000000a1
results:
  - policy: require-labels
    rule: check-app-label
    result: fail
    severity: medium
    message: "validation error: The label app is required."
    source: kyverno
  - policy: disallow-latest
    rule: check-tag
    result: pass
    source: kyverno
summary: {pass: 1, fail: 1, warn: 0, error: 0, skip: 0}
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: 7d1e0b3f-0000-4000-8000-0000000000a2
  namespace: default
scope:
  apiVersion: apps/v1
  kind: Deployment
  name: web
  namespace: default
  uid: 7d1e0b3f-0000-4000-8000-0000000000a2
results:
  - policy: require-labels
    rule: check-app-label
    result: pass
    source: kyverno
summary: {pass: 1, fail: 0, warn: 0, error: 0, skip: 0}
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: polr-ns-legacy
  namespace: legacy
results:
  - policy: require-labels
    rule: check-app-label
    result: warn
    message: label app is missing
    resources:
      - apiVersion: v1
        kind: Pod
        name: worker-1
        namespace: legacy
        uid: 7d1e0b3f-0000-4000-8000-0000000000a3
      - apiVersion: v1
        kind: Pod
        name: worker-2
        namespace: legacy
        uid: 7d1e0b3f-0000-4000-8000-0000000000a4
summary: {pass: 0, fail: 0, warn: 2, error: 0, skip: 0}
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: 7d1e0b3f-0000-4000-8000-0000000000a5
  namespace: demo
results:
  - policy: disallow-latest
    rule: check-tag
    result: fail
    source: kyverno
summary: {pass: 0, fail: 1, warn: 0, error: 0, skip: 0}

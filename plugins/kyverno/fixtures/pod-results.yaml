# A Pod and the report it owns: the "*" entry's Policy results tab, which
# goes into the Security tab on Pods. Another pod's report is left out.
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  namespace: demo
  uid: 7d1e0b3f-0000-4000-8000-0000000000a1
spec:
  containers:
    - name: web
      image: example.com/web:1.0
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: 7d1e0b3f-0000-4000-8000-0000000000a1
  namespace: demo
  ownerReferences:
    - apiVersion: v1
      kind: Pod
      name: web-0
      uid: 7d1e0b3f-0000-4000-8000-0000000000a1
scope:
  apiVersion: v1
  kind: Pod
  name: web-0
  namespace: demo
  uid: 7d1e0b3f-0000-4000-8000-0000000000a1
results:
  - policy: disallow-latest
    rule: check-tag
    result: pass
    source: kyverno
  - policy: require-labels
    rule: check-app-label
    result: fail
    severity: medium
    message: "validation error: The label app is required."
    source: kyverno
summary: {pass: 1, fail: 1, warn: 0, error: 0, skip: 0}
---
apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: 7d1e0b3f-0000-4000-8000-0000000000c9
  namespace: demo
  ownerReferences:
    - apiVersion: v1
      kind: Pod
      name: web-1
      uid: 7d1e0b3f-0000-4000-8000-0000000000c9
results:
  - policy: require-labels
    rule: check-app-label
    result: fail
summary: {pass: 0, fail: 1, warn: 0, error: 0, skip: 0}

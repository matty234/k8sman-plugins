# A SecretStore (AWS Secrets Manager, credentials from a Secret) and the
# ExternalSecrets in its namespace: two use it, one uses another store.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: demo-store
  namespace: demo
  creationTimestamp: "2025-11-01T00:00:00Z"
spec:
  refreshInterval: 300
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-key
status:
  capabilities: ReadWrite
  conditions:
    - type: Ready
      status: "True"
      reason: Valid
      message: store validated
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-token
  namespace: demo
spec:
  secretStoreRef:
    name: demo-store
status:
  conditions:
    - type: Ready
      status: "False"
      reason: SecretSyncedError
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-config
  namespace: demo
spec:
  secretStoreRef:
    kind: SecretStore
    name: demo-store
status:
  conditions:
    - type: Ready
      status: "True"
      reason: SecretSynced
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: other
  namespace: demo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: demo-store

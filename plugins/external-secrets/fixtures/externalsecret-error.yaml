# An ExternalSecret that fails to sync: its SecretStore is missing and its
# target Secret doesn't exist yet. Defaults throughout (store kind, target
# name, refresh interval, policies).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-token
  namespace: demo
  creationTimestamp: "2025-12-30T00:00:00Z"
spec:
  secretStoreRef:
    name: demo-store
  data:
    - secretKey: token
      remoteRef:
        key: demo/api
status:
  conditions:
    - type: Ready
      status: "False"
      reason: SecretSyncedError
      message: could not get secret data from provider
      lastTransitionTime: "2025-12-31T00:00:00Z"

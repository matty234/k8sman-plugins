# A PushSecret to two stores, one chosen by labels. Columns and the
# refresh action only: the module has no PushSecret panel either.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-db
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: demo-vault
      kind: ClusterSecretStore
    - labelSelector:
        matchLabels:
          team: demo
  selector:
    secret:
      name: db
status:
  refreshTime: "2025-12-31T23:00:00Z"
  conditions:
    - type: Ready
      status: "True"
      reason: Synced

# A ClusterExternalSecret selecting namespaces by labels and by name, with
# one namespace it couldn't provision.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: shared-db
  uid: 22222222-0000-0000-0000-000000000009
  creationTimestamp: "2025-12-01T00:00:00Z"
spec:
  externalSecretName: db-credentials
  namespaceSelectors:
    - matchLabels:
        team: demo
      matchExpressions:
        - key: env
          operator: In
          values: [dev, test]
  namespaces: [default]
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 15m
    secretStoreRef:
      kind: ClusterSecretStore
      name: demo-vault
status:
  provisionedNamespaces: [default, demo]
  failedNamespaces:
    - namespace: demo-test
      reason: "external secret already exists in namespace"
  conditions:
    - type: Ready
      status: "False"
      reason: PartiallyReady
      message: one or more namespaces failed

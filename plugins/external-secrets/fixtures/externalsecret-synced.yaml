# A synced ExternalSecret made by a ClusterExternalSecret, reading from a
# ClusterSecretStore, with its target Secret (keys only reach the plugin).
# The first document is the subject; the rest are what related lookups see.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: default
  uid: 22222222-0000-0000-0000-000000000001
  creationTimestamp: "2025-12-01T00:00:00Z"
  ownerReferences:
    - apiVersion: external-secrets.io/v1
      kind: ClusterExternalSecret
      name: shared-db
      uid: 22222222-0000-0000-0000-000000000009
      controller: true
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: demo-vault
  target:
    name: db
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "postgres://{{ .username }}@db.example.com/demo"
  data:
    - secretKey: username
      remoteRef:
        key: demo/db
        property: username
    - secretKey: password
      remoteRef:
        key: demo/db
        property: password
        version: "3"
  dataFrom:
    - extract:
        key: demo/shared
    - find:
        name:
          regexp: "^demo-"
        tags:
          team: demo
          env: dev
      rewrite:
        - regexp:
            source: "demo-(.*)"
            target: "$1"
status:
  refreshTime: "2025-12-31T23:45:00Z"
  syncedResourceVersion: 1-0123456789abcdef
  binding:
    name: db
  conditions:
    - type: Ready
      status: "True"
      reason: SecretSynced
      message: secret synced
      lastTransitionTime: "2025-12-01T00:00:10Z"
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: db
  namespace: default
  creationTimestamp: "2025-12-01T00:00:10Z"
data:
  username: ZGVtbw==        # never shown to the plugin: it sees ""
  password: c2VjcmV0
  url: cG9zdGdyZXM=
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: demo-vault
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: secret
      version: v2
status:
  capabilities: ReadWrite
  conditions:
    - type: Ready
      status: "True"
      reason: Valid
      message: store validated
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: shared-db
  uid: 22222222-0000-0000-0000-000000000009
spec:
  externalSecretName: db-credentials
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Ready

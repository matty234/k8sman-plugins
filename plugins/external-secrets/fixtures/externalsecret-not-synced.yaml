# An ExternalSecret that stopped syncing an hour ago (a warning; the
# externalsecret-error fixture has failed for a day, which is critical).
# Its ClusterSecretStore and target Secret exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: demo
  creationTimestamp: "2025-12-01T00:00:00Z"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: shared-store
  target:
    name: app-config
  dataFrom:
    - extract:
        key: demo/app
status:
  refreshTime: "2025-12-31T22:00:00Z"
  syncedResourceVersion: 1-0123456789abcdef
  conditions:
    - type: Ready
      status: "False"
      reason: SecretSyncedError
      message: provider returned 403
      lastTransitionTime: "2025-12-31T23:00:00Z"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: shared-store
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Valid
---
apiVersion: v1
kind: Secret
metadata:
  name: app-config
  namespace: demo
type: Opaque
data:
  config.json: c2VjcmV0
